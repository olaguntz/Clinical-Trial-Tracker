<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Clinical Trials Tracker</title>
<meta name="description" content="Find clinical trials open to new participants worldwide, and see how many studies are running by country, condition, phase and status. Updated every week from ClinicalTrials.gov. Available in English, Spanish and French.">
<meta property="og:title" content="Global Clinical Trials Tracker">
<meta property="og:description" content="Find clinical trials open to new participants worldwide. Updated weekly from ClinicalTrials.gov.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f6fdb'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --color-fg: #1d1f23; --color-fg-muted: #5f6570; --color-bg: #ffffff; --color-panel: #f6f7f9;
  --color-border-line: #e2e4e9; --color-ok: #1f8a5b; --color-warn: #b7791f; --color-bad: #d14343;
  --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-anthropic-serif: Georgia, "Times New Roman", serif;
  --cds-font-size-caption: 0.8125rem; --cds-font-size-body: 0.9375rem; --cds-font-size-heading: 1.0625rem; --cds-font-size-title: 2rem;
  --cds-font-weight-medium: 600;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px; --cds-gap-xl: 40px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 20px; --cds-pad-xl: 32px;
  --cds-radius: 10px; --cds-chart-muted: #c9ced8; --cds-chart-grid: #eceef2;
  --cds-surface-popover: #ffffff; --cds-border: #d9dce3; --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.12);
  --cds-text-secondary: #5f6570; --cds-dur-slow: .3s;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-fg: #eceef2; --color-fg-muted: #a3a9b4; --color-bg: #15171b; --color-panel: #1e2126;
    --color-border-line: #2f333a; --color-ok: #4cc38a; --color-warn: #e0a84e; --color-bad: #f07070;
    --cds-chart-muted: #454b55; --cds-chart-grid: #2a2e35; --cds-surface-popover: #23262c; --cds-border: #3a3f47;
    --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.5); --cds-text-secondary: #a3a9b4;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); }
#dash-root { padding: var(--cds-gap-lg) var(--dash-gutter) var(--cds-gap-xl); }
.dash-skeleton { color: transparent !important; background: var(--color-border-line); border-radius: 6px; animation: ct-pulse 1.4s ease-in-out infinite; }
@keyframes ct-pulse { 50% { opacity: .5; } }
.ct-footer { max-width: 1200px; margin: var(--cds-gap-xl) auto 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); border-top: 1px solid var(--color-border-line); padding-top: var(--cds-gap-md); }
.ct-footer a { color: inherit; }
</style>
</head>
<body>
<div id="dash-root">
<style>
#dash-root { --dash-gutter: clamp(12px, 3vw, 32px); }
.ct { font-family: var(--font-anthropic-sans); color: var(--color-fg); max-width: 1200px; margin-inline: auto; }
.ct-top { display: flex; flex-wrap: wrap; gap: var(--cds-gap-md); align-items: flex-start; justify-content: space-between; }
.ct-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; line-height: 1.2; }
.ct-takeaway { margin: var(--cds-gap-xs) 0 0; font-size: var(--cds-font-size-body); max-width: 60ch; }
.ct-takeaway b, .ct b { font-weight: 600; }
.ct-meta { margin: var(--cds-gap-xs) 0 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.ct-lang { display: flex; align-items: center; gap: var(--cds-gap-xs); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.ct-lang select, .ct-input, .ct-select { font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-xs) var(--cds-pad-sm); min-height: 2.25rem; }
.ct-notice { margin: var(--cds-gap-md) 0 0; padding: var(--cds-pad-sm) var(--cds-pad-md); border: 1px solid var(--color-border-line); border-left: 3px solid var(--color-warn); border-radius: var(--cds-radius); background: var(--color-panel); font-size: var(--cds-font-size-caption); }
.ct-tabs { display: flex; gap: var(--cds-gap-xs); margin: var(--cds-gap-lg) 0 var(--cds-gap-md); border-bottom: 1px solid var(--color-border-line); overflow-x: auto; scrollbar-width: thin; }
.ct-tab { font: inherit; font-size: var(--cds-font-size-body); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--color-fg-muted); padding: var(--cds-pad-sm) var(--cds-pad-md); cursor: pointer; white-space: nowrap; }
.ct-tab[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--color-fg); font-weight: 500; }
.ct-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--cds-gap-md); }
.ct-tile, .ct-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); position: relative; min-width: 0; }
.ct-tile-label { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.ct-tile-num { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; margin: var(--cds-gap-xs) 0; min-height: 1.3em; }
.ct-tile-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.ct-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: var(--cds-gap-md); margin-top: var(--cds-gap-md); }
.ct-card h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
.ct-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: var(--cds-gap-xs) 0 var(--cds-gap-md); }
.ct-chart { min-height: 220px; position: relative; }
.ct-chart svg { display: block; overflow: visible; }
.ct-chart text { font-family: var(--font-anthropic-sans); font-size: 12px; fill: var(--color-fg-muted); }
.ct-chart .ct-lbl { fill: var(--color-fg); }
.ct-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; z-index: 2; }
.ct-tip .ct-tip-h { color: var(--cds-text-secondary); }
.ct-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: var(--cds-gap-sm); align-items: end; margin-bottom: var(--cds-gap-md); }
.ct-filters label { display: flex; flex-direction: column; gap: 4px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); min-width: 0; }
.ct-filters .ct-wide { grid-column: 1 / -1; }
.ct-check { flex-direction: row !important; align-items: center; gap: var(--cds-gap-xs) !important; min-height: 2.25rem; }
.ct-btn { font: inherit; font-size: var(--cds-font-size-body); background: var(--color-bg); color: var(--color-fg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-xs) var(--cds-pad-md); min-height: 2.25rem; cursor: pointer; }
.ct-btn:hover { background: var(--color-panel); }
.ct-count { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: 0 0 var(--cds-gap-sm); }
.ct-tablewrap { max-height: 34rem; overflow: auto; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); }
.ct-table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-caption); }
.ct-table th { position: sticky; top: 0; background: var(--color-panel); text-align: left; font-weight: 500; padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; z-index: 1; }
.ct-table td { padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); vertical-align: top; }
.ct-table td.ct-num, .ct-table th.ct-num { text-align: right; font-variant-numeric: tabular-nums; }
.ct-table a { color: inherit; }
.ct-table .ct-t { font-size: var(--cds-font-size-body); color: var(--color-fg); }
.ct-table .ct-sub { color: var(--color-fg-muted); margin-top: 2px; }
.ct-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--color-border-line); white-space: nowrap; }
.ct-pill.ct-open { border-color: var(--color-ok); color: var(--color-ok); }
.ct-more { margin-top: var(--cds-gap-sm); display: flex; flex-wrap: wrap; gap: var(--cds-gap-md); align-items: center; }
.ct-link { color: var(--color-fg); font-size: var(--cds-font-size-caption); }
.ct-learn { max-width: 70ch; }
.ct-learn h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: var(--cds-gap-lg) 0 var(--cds-gap-xs); }
.ct-learn h2:first-child { margin-top: 0; }
.ct-learn p, .ct-learn li { font-size: var(--cds-font-size-body); line-height: 1.55; }
.ct-empty { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); padding: var(--cds-pad-md); }
.ct-fail { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: inherit; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.ct-fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
[data-dash-source-state=empty] { color: transparent; }
[data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
@media (max-width: 640px) { .ct-hide-narrow { display: none; } }
</style>

<div class="ct">
  <div class="ct-top">
    <div>
      <h1 class="ct-title" id="ct-title">Global Clinical Trials Tracker</h1>
      <p class="ct-takeaway" id="ct-takeaway"><span class="ct-tk-a"></span><b data-source="summary" data-field="value" data-where="metric=total" class="dash-skeleton">—</b><span class="ct-tk-b"></span><b data-source="summary" data-field="value" data-where="metric=open" class="dash-skeleton">—</b><span class="ct-tk-c"></span><b data-source="summary" data-field="value" data-where="metric=countries" class="dash-skeleton">—</b><span class="ct-tk-d"></span></p>
      <p class="ct-meta"><span class="ct-rf-a"></span><span data-source="refreshed" data-field="refreshed" data-row="0" class="ct-rf-date">—</span><span class="ct-rf-b"></span></p>
    </div>
    <label class="ct-lang"><span class="ct-lang-label">Language</span>
      <select class="ct-lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
    </label>
  </div>
  <p class="ct-notice" id="ct-disclaimer"></p>

  <div class="ct-tabs" role="tablist">
    <button class="ct-tab" role="tab" id="overview" data-tab="overview"></button>
    <button class="ct-tab" role="tab" id="finder" data-tab="finder"></button>
    <button class="ct-tab" role="tab" id="places" data-tab="places"></button>
    <button class="ct-tab" role="tab" id="week" data-tab="week"></button>
    <button class="ct-tab" role="tab" id="learn" data-tab="learn"></button>
  </div>

  <section class="ct-page" data-page="overview" id="page-overview">
    <div class="ct-tiles">
      <div class="ct-tile" id="tile-total"><div class="ct-tile-label" data-t="tile.total"></div><div class="ct-tile-num dash-skeleton" data-source="summary" data-field="value" data-where="metric=total" data-fetchpriority="high">—</div><div class="ct-tile-note" data-t="tile_note.total"></div></div>
      <div class="ct-tile" id="tile-open"><div class="ct-tile-label" data-t="tile.open"></div><div class="ct-tile-num dash-skeleton" data-source="summary" data-field="value" data-where="metric=open" data-fetchpriority="high">—</div><div class="ct-tile-note" data-t="tile_note.open"></div></div>
      <div class="ct-tile" id="tile-countries"><div class="ct-tile-label" data-t="tile.countries"></div><div class="ct-tile-num dash-skeleton" data-source="summary" data-field="value" data-where="metric=countries">—</div><div class="ct-tile-note" data-t="tile_note.countries"></div></div>
      <div class="ct-tile" id="tile-new"><div class="ct-tile-label" data-t="tile.new_week"></div><div class="ct-tile-num dash-skeleton" data-source="summary" data-field="value" data-where="metric=new_week">—</div><div class="ct-tile-note" data-t="tile_note.new_week"></div></div>
      <div class="ct-tile" id="tile-completed"><div class="ct-tile-label" data-t="tile.completed"></div><div class="ct-tile-num dash-skeleton" data-source="summary" data-field="value" data-where="metric=completed">—</div><div class="ct-tile-note" data-t="tile_note.completed"></div></div>
      <div class="ct-tile" id="tile-results"><div class="ct-tile-label" data-t="tile.with_results"></div><div class="ct-tile-num dash-skeleton" data-source="summary" data-field="value" data-where="metric=with_results">—</div><div class="ct-tile-note" data-t="tile_note.with_results"></div></div>
    </div>
    <div class="ct-grid">
      <div class="ct-card" id="card-status"><h2 data-t="card.status"></h2><p class="ct-note" data-t="card.status_note"></p><div class="ct-chart" id="chart-status" data-source="by_status"></div></div>
      <div class="ct-card" id="card-phase"><h2 data-t="card.phase"></h2><p class="ct-note" data-t="card.phase_note"></p><div class="ct-chart" id="chart-phase" data-source="by_phase"></div></div>
      <div class="ct-card" id="card-year"><h2 data-t="card.year"></h2><p class="ct-note" data-t="card.year_note"></p><div class="ct-chart" id="chart-year" data-source="by_year"></div></div>
      <div class="ct-card" id="card-sponsor"><h2 data-t="card.sponsor"></h2><p class="ct-note" data-t="card.sponsor_note"></p><div class="ct-chart" id="chart-sponsor" data-source="by_sponsor"></div></div>
    </div>
  </section>

  <section class="ct-page" data-page="finder" id="page-finder" hidden></section>
  <template id="tpl-finder">
    <div class="ct-card" id="card-finder">
      <h2 data-t="card.finder"></h2><p class="ct-note" data-t="card.finder_note"></p>
      <div class="ct-filters">
        <label class="ct-wide"><span data-t="f.search"></span><input class="ct-input ct-f-q" type="search" autocomplete="off"></label>
        <label><span data-t="f.country"></span><select class="ct-select ct-f-country" data-source="by_country"></select></label>
        <label><span data-t="f.status"></span><select class="ct-select ct-f-status"></select></label>
        <label><span data-t="f.phase"></span><select class="ct-select ct-f-phase"></select></label>
        <label><span data-t="f.age"></span><input class="ct-input ct-f-age" type="number" min="0" max="120" inputmode="numeric"></label>
        <label><span data-t="f.sex"></span><select class="ct-select ct-f-sex"></select></label>
        <label class="ct-check"><input type="checkbox" class="ct-f-hv"><span data-t="f.healthy"></span></label>
        <button class="ct-btn ct-f-reset" data-t="f.reset"></button>
      </div>
      <p class="ct-count ct-f-count"></p>
      <div class="ct-tablewrap">
        <table class="ct-table ct-finder-table" data-source="open_trials" data-row-key="id">
          <thead><tr>
            <th data-field="id" data-t="col.id"></th>
            <th data-field="title" data-t="col.title"></th>
            <th data-field="status" data-t="col.status"></th>
            <th data-field="phase" data-t="col.phase" class="ct-hide-narrow"></th>
            <th data-field="countries" data-t="col.countries" class="ct-hide-narrow"></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="ct-more"><button class="ct-btn ct-f-more" data-t="show_more" hidden></button><a class="ct-link ct-f-all" target="_blank" rel="noopener" data-t="search_all"></a></div>
    </div>
  </template>

  <section class="ct-page" data-page="places" id="page-places" hidden>
    <div class="ct-card" id="card-countries"><h2 data-t="card.countries"></h2><p class="ct-note" data-t="card.countries_note"></p><div class="ct-chart" id="chart-countries" data-source="by_country"></div></div>
    <div class="ct-grid">
      <div class="ct-card" id="card-country-table"><h2 data-t="card.country_table"></h2><p class="ct-note" data-t="card.country_table_note"></p>
        <input class="ct-input ct-search-country" type="search" style="width:100%;margin-bottom:var(--cds-gap-sm)">
        <div class="ct-tablewrap"><table class="ct-table ct-country-table" data-source="by_country" data-row-key="country"><thead><tr>
          <th data-field="country" data-t="col.country"></th><th data-field="trials" data-t="col.trials" class="ct-num"></th><th data-field="open_trials" data-t="col.open_trials" class="ct-num"></th>
        </tr></thead><tbody></tbody></table></div>
      </div>
      <div class="ct-card" id="card-conditions"><h2 data-t="card.conditions"></h2><p class="ct-note" data-t="card.conditions_note"></p>
        <input class="ct-input ct-search-condition" type="search" style="width:100%;margin-bottom:var(--cds-gap-sm)">
        <div class="ct-tablewrap"><table class="ct-table ct-condition-table" data-source="by_condition" data-row-key="condition"><thead><tr>
          <th data-field="condition" data-t="col.condition"></th><th data-field="trials" data-t="col.trials" class="ct-num"></th><th data-field="open_trials" data-t="col.open_trials" class="ct-num"></th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </div>
  </section>

  <section class="ct-page" data-page="week" id="page-week" hidden>
    <div class="ct-card" id="card-new-week"><h2 data-t="card.new_week"></h2><p class="ct-note" data-t="card.new_week_note"></p>
      <input class="ct-input ct-search-new" type="search" style="width:100%;margin-bottom:var(--cds-gap-sm)">
      <div class="ct-tablewrap"><table class="ct-table ct-new-table" data-source="new_week" data-row-key="id"><thead><tr>
        <th data-field="id" data-t="col.id"></th><th data-field="title" data-t="col.title"></th><th data-field="status" data-t="col.status"></th><th data-field="first_posted" data-t="col.first_posted" class="ct-hide-narrow"></th>
      </tr></thead><tbody></tbody></table></div>
    </div>
    <div class="ct-card" id="card-changes" style="margin-top:var(--cds-gap-md)"><h2 data-t="card.changes"></h2><p class="ct-note" data-t="card.changes_note"></p>
      <p class="ct-empty ct-changes-first" hidden data-t="card.changes_first"></p>
      <div class="ct-tablewrap ct-changes-wrap"><table class="ct-table ct-changes-table" data-source="status_changes" data-row-key="id"><thead><tr>
        <th data-field="id" data-t="col.id"></th><th data-field="title" data-t="col.title"></th><th data-field="from_status" data-t="col.from_status"></th><th data-field="to_status" data-t="col.to_status"></th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section class="ct-page" data-page="learn" id="page-learn" hidden>
    <div class="ct-card ct-learn" id="card-learn"></div>
  </section>
</div>

<footer class="ct-footer">
  Study data: <a href="https://clinicaltrials.gov" target="_blank" rel="noopener">ClinicalTrials.gov</a>, U.S. National Library of Medicine. Updated automatically every Monday. This site is not affiliated with ClinicalTrials.gov and is not medical advice.
</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data-loader.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
// When this site is embedded in another website, tell the host page how tall it is.
(function () {
  if (window.parent === window) return;
  let last = 0;
  const send = () => {
    const h = Math.ceil(document.documentElement.scrollHeight);
    if (h !== last) { last = h; window.parent.postMessage({ type: 'ct-tracker-height', height: h }, '*'); }
  };
  new ResizeObserver(send).observe(document.body);
  window.addEventListener('load', send);
})();
</script>
</body>
</html>
